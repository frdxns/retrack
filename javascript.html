<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>script.laele</title>
    <style>
        .caixa{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 95vh;
            background-color: white;
        }

        #botaocentro{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            border: none;
            border-radius: 50%;
            background-color: lightgreen;
            font-weight: bold;
            color: antiquewhite;
            transition: all .5s;
        }

        #botaocentro:hover{
            background-color: rgb(47, 255, 120);
        }

        #botaocentro:active{
            background-color: black;
        }

    </style>
</head>
<body>
    <div class="caixa">
        <input type="button" value="aperte" style="width: 80px; height: 80px;" onclick="apertou()" id="botaocentro">
    </div>

    <script>
        function apertou(){
            const botao = document.getElementById('botaocentro');
            const fundo = document.getElementsByClassName('caixa');

            if(fundo.style.backgroundColor = "white"){
                fundo.style.backgroundColor =  "lightblue";
            }else{
                fundo.style.backgroundColor = "red";
            }
        }

    </script>
</body>
</html>
